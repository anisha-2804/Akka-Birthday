<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Akka ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loading -->

<div id="loader">

<h1>Loading Surprise...</h1>

</div>

<!-- Background Music -->

<!--
YOUR SONG HERE

music/song.mp3

-->

<audio id="music" loop>

<source src="music/AkkaSong.mp3" type="audio/mp3">

</audio>

<!-- Floating Hearts -->

<div id="hearts"></div>

<!-- Hero -->

<section class="hero">

<h3>🎉 Happy Birthday 🎉</h3>

<h1>AKKA ❤️</h1>

<p id="typing"></p>

<button id="playMusic">

Play Music 🎵

</button>

</section>

<!-- Gallery -->

<section class="gallery">

<h2>Beautiful Memories 📸</h2>

<div class="slider">

<!--

PUT YOUR IMAGES HERE

-->

<img src="images/1.jpg">

<img src="images/2.jpg">

<img src="images/3.jpg">

<img src="images/4.jpg">

<img src="images/5.jpg">

</div>

</section>

<!-- Videos -->

<section class="videos">

<h2>Special Videos 🎥</h2>

<div class="videoBox">

<!--

PUT VIDEOS HERE

-->

<video controls>

<source src="videos/1.mp4">

</video>

<video controls>

<source src="videos/2.mp4">

</video>

</div>

</section>

<!-- Letter -->

<section class="letter">

<h2>Dear Akka ❤️</h2>

<p>

Every smile of yours is precious.

Thank you for being the best sister.

You are my biggest support,

my betterhalf,

my happiness,

my strength.

Happy Birthday Akka❤️

</p>

</section>

<!-- Cake -->

<section class="cakeSection">

<h2>Make A Wish 🎂</h2>

<div class="cake">

🎂

</div>

<button id="cakeBtn">

Cut Cake 🎉

</button>

</section>

<!-- Fireworks -->

<canvas id="fireworks"></canvas>

<script src="script.js"></script>

</body>

</html>
